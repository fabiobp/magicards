<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagiCards — Pitch Deck</title>
<style>
  :root {
    --bg: #0a0a10;
    --bar: rgba(16, 16, 24, 0.85);
    --accent: #8b5cf6;
    --text: #e5e7eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
  }

  .slide {
    position: absolute;
    inset: 0;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .slide.active {
    visibility: visible;
    opacity: 1;
  }
  .slide > img.base {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .overlay { position: absolute; overflow: hidden; }
  .overlay > img { width: 100%; height: 100%; display: block; }
  .overlay.crop > img { position: absolute; }

  .overlay.video { background: #000; }
  .overlay.video iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  #navbar {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 16px;
    background: var(--bar);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 50;
  }
  body:hover #navbar, #navbar:focus-within { opacity: 1; }

  #navbar button {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  #navbar button:hover { background: rgba(139, 92, 246, 0.25); transform: scale(1.08); }

  #counter { font-size: 13px; letter-spacing: 0.08em; min-width: 56px; text-align: center; opacity: 0.85; }

  #progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #c084fc);
    transition: width 0.3s ease;
    z-index: 60;
  }

  .nav-zone {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 12vw;
    z-index: 40;
    cursor: pointer;
  }
  #zone-prev { left: 0; }
  #zone-next { right: 0; }
</style>
</head>
<body>

<div id="progress"></div>

<main id="stage" aria-label="MagiCards Pitch Deck">

  <section class="slide active" data-slide="1">
    <img class="base" src="slides/slide1.png" alt="Slide 1" draggable="false">
  </section>

  <section class="slide" data-slide="2">
    <img class="base" src="slides/slide2.png" alt="Slide 2" draggable="false">

    <div class="overlay" style="left:4.7502%; top:23.5059%; width:18.6563%; height:18.6108%;">
      <img src="media/image23.gif" alt="" loading="lazy" draggable="false">
    </div>

    <div class="overlay" style="left:66.3996%; top:13.7323%; width:28.9062%; height:28.8691%;">
      <img src="media/image24.gif" alt="" loading="lazy" draggable="false">
    </div>
    <div class="overlay" style="left:65.9491%; top:29.4887%; width:4.4025%; height:7.8266%;">
      <img src="media/image26.png" alt="" loading="lazy" draggable="false">
    </div>
    <div class="overlay" style="left:85.3333%; top:39.6979%; width:4.4982%; height:7.9968%;">
      <img src="media/image25.png" alt="" loading="lazy" draggable="false">
    </div>
    <div class="overlay" style="left:89.7757%; top:38.6616%; width:4.6813%; height:8.3223%;">
      <img src="media/image27.png" alt="" loading="lazy" draggable="false">
    </div>

    <div class="overlay" style="left:35.5926%; top:14.5518%; width:28.8845%; height:28.7654%;">
      <img src="media/image30.gif" alt="" loading="lazy" draggable="false">
    </div>
    <div class="overlay" style="left:32.6566%; top:10.2127%; width:10.3927%; height:17.8155%;">
      <img src="media/image32.png" alt="" loading="lazy" draggable="false">
    </div>
    <div class="overlay" style="left:53.4623%; top:36.5174%; width:7.6742%; height:13.1554%;">
      <img src="media/image33.png" alt="" loading="lazy" draggable="false">
    </div>
    <div class="overlay" style="left:33.1210%; top:31.5771%; width:8.4069%; height:14.4114%;">
      <img src="media/image34.png" alt="" loading="lazy" draggable="false">
    </div>

    <div class="overlay crop" style="left:36.4592%; top:57.4346%; width:27.0911%; height:27.1344%;">
      <img src="media/image31.gif" alt="" loading="lazy" draggable="false"
           style="width:122.2179%; height:122.0719%; left:-10.7050%; top:-14.4825%;">
    </div>
  </section>

  <section class="slide" data-slide="3">
    <img class="base" src="slides/slide3.png" alt="Slide 3" draggable="false">

    <div class="overlay crop" style="left:35.5291%; top:57.7194%; width:28.4524%; height:25.6448%;">
      <img src="media/image44.gif" alt="" loading="lazy" draggable="false"
           style="width:100%; height:109.2318%; left:0; top:-9.2310%;">
    </div>

    <div class="overlay crop" style="left:67.1740%; top:19.6095%; width:27.3707%; height:24.0990%;">
      <img src="media/image45.gif" alt="" loading="lazy" draggable="false"
           style="width:118.1446%; height:134.1053%; left:-10.3081%; top:-26.0138%;">
    </div>
  </section>

  <section class="slide" data-slide="4">
    <img class="base" src="slides/slide4.png" alt="Slide 4" loading="lazy" draggable="false">
    <div class="overlay video" style="left:0; top:0; width:100%; height:100%;">
      <iframe data-src="https://www.youtube-nocookie.com/embed/ksJn1VwlFUc?rel=0&playsinline=1"
              title="MagiCards Trailer" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </section>

  <section class="slide" data-slide="5">
    <img class="base" src="slides/slide5.png" alt="Slide 5" loading="lazy" draggable="false">
  </section>
  <section class="slide" data-slide="6">
    <img class="base" src="slides/slide6.png" alt="Slide 6" loading="lazy" draggable="false">
  </section>
  <section class="slide" data-slide="7">
    <img class="base" src="slides/slide7.png" alt="Slide 7" loading="lazy" draggable="false">
  </section>
  <section class="slide" data-slide="8">
    <img class="base" src="slides/slide8.png" alt="Slide 8" loading="lazy" draggable="false">
  </section>
  <section class="slide" data-slide="9">
    <img class="base" src="slides/slide9.png" alt="Slide 9" loading="lazy" draggable="false">
  </section>
  <section class="slide" data-slide="10">
    <img class="base" src="slides/slide10.png" alt="Slide 10" loading="lazy" draggable="false">
  </section>

</main>

<div id="zone-prev" class="nav-zone" title="Anterior"></div>
<div id="zone-next" class="nav-zone" title="Próximo"></div>

<nav id="navbar">
  <button id="btn-prev" aria-label="Slide anterior">&#10094;</button>
  <span id="counter">1 / 10</span>
  <button id="btn-next" aria-label="Próximo slide">&#10095;</button>
  <button id="btn-full" aria-label="Tela cheia">&#9974;</button>
</nav>

<script>
(function () {
  const slides = Array.from(document.querySelectorAll('.slide'));
  const total = slides.length;
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  let current = 0;

  function show(index, updateHash = true) {
    current = Math.max(0, Math.min(total - 1, index));
    slides.forEach((s, i) => s.classList.toggle('active', i === current));
    counter.textContent = (current + 1) + ' / ' + total;
    progress.style.width = ((current + 1) / total * 100) + '%';

    slides.forEach((s) => {
      const frame = s.querySelector('iframe[data-src]');
      if (!frame) return;
      if (s.classList.contains('active')) {
        if (!frame.src) frame.src = frame.dataset.src;
      } else if (frame.src) {
        frame.src = '';
      }
    });

    if (updateHash) history.replaceState(null, '', '#' + (current + 1));
  }

  const next = () => show(current + 1);
  const prev = () => show(current - 1);

  document.getElementById('btn-next').addEventListener('click', next);
  document.getElementById('btn-prev').addEventListener('click', prev);
  document.getElementById('zone-next').addEventListener('click', next);
  document.getElementById('zone-prev').addEventListener('click', prev);

  document.getElementById('btn-full').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(total - 1);
    else if (e.key.toLowerCase() === 'f') document.getElementById('btn-full').click();
  });

  let touchX = null;
  document.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) (dx < 0 ? next : prev)();
    touchX = null;
  }, { passive: true });

  const fromHash = parseInt(location.hash.replace('#', ''), 10);
  if (!isNaN(fromHash)) show(fromHash - 1, false);
})();
</script>

</body>
</html>
